<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 万界战力榜</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #080d1b; color: white; }
    header { padding: 22px 16px; text-align: center; background: linear-gradient(135deg, #172b59, #35165e); border-bottom: 1px solid #33436b; }
    header h1 { margin: 0; font-size: 30px; color: #f5d889; }
    header p { color: #c4cbe0; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; padding: 14px; background: #111a30; }
    nav a { color: #d9e4ff; text-decoration: none; }
    main { max-width: 900px; margin: auto; padding: 20px 14px; }
    .card { max-width: 420px; margin: 20px auto; padding: 22px; background: #121c32; border: 1px solid #293b60; border-radius: 14px; }
    .card h3 { color: #e9c878; margin-top: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .tabs button { flex: 1; padding: 10px; background: transparent; color: #b9c5dd; border: 1px solid #293b60; border-radius: 10px; font-size: 15px; }
    .tabs button.on { background: #e5b84f; color: #171322; border-color: #e5b84f; font-weight: bold; }
    label { display: block; font-size: 13px; color: #b9c5dd; margin: 14px 0 6px; }
    input { width: 100%; padding: 12px; font-size: 16px; color: white; background: #0b1326; border: 1px solid #293b60; border-radius: 10px; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #e5b84f; outline-offset: 2px; }
    .captcha { margin-top: 16px; min-height: 0; }
    .go { width: 100%; margin-top: 20px; padding: 12px; font-size: 16px; font-weight: bold; color: #171322; background: #e5b84f; border: 0; border-radius: 10px; }
    .go:disabled { opacity: .6; }
    .out { width: 100%; margin-top: 16px; padding: 11px; font-size: 15px; color: #d9e4ff; background: transparent; border: 1px solid #293b60; border-radius: 10px; }
    .msg { margin-top: 14px; font-size: 14px; min-height: 20px; line-height: 1.6; }
    .msg.err { color: #ff9a9a; }
    .msg.ok { color: #f5d889; }
    .me { display: none; }
    .me .row { margin: 10px 0; color: #b9c5dd; }
    .me .row b { color: white; }
    .me a { color: #f5d889; }
    footer { text-align: center; padding: 25px; color: #8593ad; border-top: 1px solid #263451; margin-top: 35px; }
  </style>
</head>
<body>
  <header>
    <h1>万界战力榜</h1>
    <p>原创角色 · 跨界对决 · 战力排行</p>
  </header>

  <nav>
    <a href="index.html">首页</a>
    <a href="index.html#ranking">战力榜</a>
    <a href="index.html#features">核心功能</a>
    <a href="index.html#about">关于我们</a>
    <a href="login.html">登录</a>
  </nav>

  <main>
    <div class="card">
      <h3 id="title">账号登录</h3>

      <div id="formArea">
        <div class="tabs">
          <button type="button" id="tabLogin" class="on">登录</button>
          <button type="button" id="tabReg">注册</button>
        </div>
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="email" inputmode="email">
        <label for="pwd">密码（至少 6 位）</label>
        <input id="pwd" type="password" autocomplete="current-password">
        <div id="captchaBox" class="captcha"></div>
        <button class="go" id="go" type="button">登录</button>
      </div>

      <div class="me" id="meArea">
        <div class="row">账号：<b id="meEmail"></b></div>
        <div class="row">身份：<b id="meRole"></b></div>
        <div class="row">状态：<b id="meStatus"></b></div>
        <div class="row" id="adminLink" style="display:none"><a href="admin.html">进入站长后台</a></div>
        <div class="row"><a href="index.html">返回首页</a></div>
        <button class="out" id="out" type="button">退出登录</button>
      </div>

      <div class="msg" id="msg" role="status"></div>
    </div>
  </main>

  <footer>
    万界战力榜 · 私人测试版<br>
    © 2026 版权所有
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
  <script>
    const SUPABASE_URL = "https://wkvdwdryofxkdqrzjxrc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yiX8PUtIeStcR3BePHcL_Q_Bv2N4nsS";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // hCaptcha 的 Site Key（公开的），粘贴在引号里；留空则不显示验证框
    const HCAPTCHA_SITEKEY = "d60C58EA-5b56-48f4-b47e-63b4c7f6003e";

    const $ = id => document.getElementById(id);
    let mode = "login", captchaId = null;

    function initCaptcha() {
      if (!HCAPTCHA_SITEKEY) return;
      if (!window.hcaptcha) { setTimeout(initCaptcha, 300); return; }
      captchaId = hcaptcha.render("captchaBox", { sitekey: HCAPTCHA_SITEKEY, theme: "dark" });
    }
    function captchaToken() {
      if (!HCAPTCHA_SITEKEY) return undefined;
      return hcaptcha.getResponse(captchaId) || null;
    }
    function resetCaptcha() { if (HCAPTCHA_SITEKEY && window.hcaptcha) hcaptcha.reset(captchaId); }

    function say(text, type) { const m = $("msg"); m.textContent = text || ""; m.className = "msg " + (type || ""); }

    function setMode(m) {
      mode = m;
      $("tabLogin").classList.toggle("on", m === "login");
      $("tabReg").classList.toggle("on", m === "reg");
      $("go").textContent = m === "login" ? "登录" : "注册";
      $("pwd").autocomplete = m === "login" ? "current-password" : "new-password";
      say("");
    }
    $("tabLogin").onclick = () => setMode("login");
    $("tabReg").onclick = () => setMode("reg");

    function errText(e) {
      const t = (e && e.message) || "";
      if (t.includes("Invalid login")) return "邮箱或密码不对";
      if (t.includes("already registered")) return "这个邮箱已注册，请直接登录";
      if (t.includes("Email not confirmed")) return "邮箱还没确认，请先点邮件里的确认链接";
      if (t.includes("at least 6")) return "密码至少 6 位";
      if (t.toLowerCase().includes("captcha")) return "人机验证失败，请重试";
    if (t.includes("rate limit")) return "操作太频繁，请稍后再试";
      return "出错了：" + t;
    }

    $("go").onclick = async () => {
      const email = $("email").value.trim(), password = $("pwd").value;
      if (!email || !password) { say("请填写邮箱和密码", "err"); return; }
      const token = captchaToken();
      if (token === null) { say("请先完成人机验证", "err"); return; }
      const options = token ? { captchaToken: token } : undefined;
      $("go").disabled = true; say("处理中…");
      try {
        if (mode === "login") {
          const { error } = await db.auth.signInWithPassword({ email, password, options });
          if (error) throw error;
          await showMe();
        } else {
          const { data, error } = await db.auth.signUp({ email, password, options });
          if (error) throw error;
          if (data.session) { await showMe(); }
          else { say("注册成功！请去邮箱点确认链接，然后回来登录", "ok"); setMode("login"); }
        }
      } catch (e) { say(errText(e), "err"); }
      resetCaptcha();
      $("go").disabled = false;
    };

    async function showMe() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { $("formArea").style.display = ""; $("meArea").style.display = "none"; return; }
      const { data: p } = await db.from("profiles").select("username, role, status").eq("id", user.id).maybeSingle();
      if (p && p.status === "banned") {
        await db.auth.signOut();
        say("该账号已被封禁，无法使用", "err");
        return;
      }
      $("formArea").style.display = "none";
      $("meArea").style.display = "block";
      $("title").textContent = "我的账号";
      $("meEmail").textContent = user.email;
      $("meRole").textContent = p && p.role === "admin" ? "站长" : "普通用户";
      $("meStatus").textContent = p ? "正常" : "资料未生成";
      $("adminLink").style.display = p && p.role === "admin" ? "block" : "none";
      say("");
    }

    $("out").onclick = async () => {
      await db.auth.signOut();
      $("meArea").style.display = "none"; $("formArea").style.display = "";
      $("title").textContent = "账号登录";
      say("已退出登录", "ok");
    };

    initCaptcha();
    showMe();
  </script>
</body>
</html>
