<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站长后台 · 万界战力榜</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #080d1b; color: white; }
    header { padding: 22px 16px; text-align: center; background: linear-gradient(135deg, #172b59, #35165e); border-bottom: 1px solid #33436b; }
    header h1 { margin: 0; font-size: 30px; color: #f5d889; }
    header p { color: #c4cbe0; margin: 8px 0 0; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; padding: 14px; background: #111a30; }
    nav a { color: #d9e4ff; text-decoration: none; }
    main { max-width: 900px; margin: auto; padding: 20px 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tabs button, .filters button { padding: 10px 16px; background: transparent; color: #b9c5dd; border: 1px solid #293b60; border-radius: 10px; font-size: 15px; }
    .tabs button { flex: 1; }
    .tabs button.on, .filters button.on { background: #e5b84f; color: #171322; border-color: #e5b84f; font-weight: bold; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filters button { padding: 8px 14px; font-size: 14px; }
    .card { padding: 18px; background: #121c32; border: 1px solid #293b60; border-radius: 14px; margin-bottom: 14px; }
    .card h3 { color: #e9c878; margin: 0 0 6px; }
    .meta { color: #8593ad; font-size: 13px; margin-bottom: 10px; }
    .field { color: #b9c5dd; line-height: 1.7; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .field b { color: #d9e4ff; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; margin-left: 6px; border: 1px solid; }
    .tag.pending { color: #f5d889; border-color: #f5d889; }
    .tag.approved { color: #7fe0a8; border-color: #7fe0a8; }
    .tag.rejected, .tag.banned { color: #ff9a9a; border-color: #ff9a9a; }
    .tag.active, .tag.admin { color: #8ab4ff; border-color: #8ab4ff; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .acts button { padding: 9px 16px; border-radius: 10px; border: 1px solid #293b60; background: transparent; color: #d9e4ff; font-size: 14px; }
    .acts .ok { background: #e5b84f; color: #171322; border-color: #e5b84f; font-weight: bold; }
    .acts .bad { color: #ff9a9a; border-color: #ff9a9a; }
    button:disabled { opacity: .5; }
    button:focus-visible, a:focus-visible { outline: 2px solid #e5b84f; outline-offset: 2px; }
    .msg { padding: 14px; text-align: center; color: #b9c5dd; line-height: 1.7; }
    .msg.err { color: #ff9a9a; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #e5b84f; color: #171322; padding: 10px 20px; border-radius: 10px; font-weight: bold; display: none; max-width: 90%; }
    footer { text-align: center; padding: 25px; color: #8593ad; border-top: 1px solid #263451; margin-top: 35px; }
  </style>
</head>
<body>
  <header>
    <h1>站长后台</h1>
    <p>审核角色 · 管理用户</p>
  </header>

  <nav>
    <a href="index.html">首页</a>
    <a href="login.html">我的账号</a>
  </nav>

  <main>
    <div id="gate" class="msg">正在验证身份…</div>

    <div id="panel" style="display:none">
      <div class="tabs">
        <button type="button" id="tabSub" class="on">提交审核</button>
        <button type="button" id="tabUser">用户管理</button>
      </div>
      <div class="filters" id="filters">
        <button type="button" data-f="pending" class="on">待审核</button>
        <button type="button" data-f="approved">已通过</button>
        <button type="button" data-f="rejected">已驳回</button>
        <button type="button" data-f="all">全部</button>
      </div>
      <div id="list"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <footer>
    万界战力榜 · 私人测试版<br>
    © 2026 版权所有
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const db = supabase.createClient(
      "https://wkvdwdryofxkdqrzjxrc.supabase.co",
      "sb_publishable_yiX8PUtIeStcR3BePHcL_Q_Bv2N4nsS"
    );
    const $ = id => document.getElementById(id);
    let me = null, view = "sub", filter = "pending";

    // 用 textContent 创建元素，避免用户提交的内容被当成代码执行
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function toast(t) {
      const x = $("toast"); x.textContent = t; x.style.display = "block";
      clearTimeout(toast.t); toast.t = setTimeout(() => x.style.display = "none", 2200);
    }
    function fmt(s) { return s ? new Date(s).toLocaleString("zh-CN") : ""; }
    const LABEL = { pending: "待审核", approved: "已通过", rejected: "已驳回", active: "正常", normal: "正常", banned: "已封禁", admin: "站长", user: "普通用户" };

    async function init() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { $("gate").innerHTML = ""; const a = el("a", "", "请先登录"); a.href = "login.html"; a.style.color = "#f5d889"; $("gate").append(a); return; }
      const { data: p } = await db.from("profiles").select("role, status").eq("id", user.id).maybeSingle();
      if (!p || p.role !== "admin") { $("gate").textContent = "你没有站长权限"; $("gate").className = "msg err"; return; }
      me = user;
      $("gate").style.display = "none"; $("panel").style.display = "block";
      load();
    }

    $("tabSub").onclick = () => { view = "sub"; $("tabSub").classList.add("on"); $("tabUser").classList.remove("on"); $("filters").style.display = "flex"; load(); };
    $("tabUser").onclick = () => { view = "user"; $("tabUser").classList.add("on"); $("tabSub").classList.remove("on"); $("filters").style.display = "none"; load(); };
    $("filters").onclick = e => {
      const f = e.target.dataset.f; if (!f) return;
      filter = f;
      [...$("filters").children].forEach(b => b.classList.toggle("on", b.dataset.f === f));
      load();
    };

    async function load() {
      $("list").replaceChildren(el("div", "msg", "加载中…"));
      try { view === "sub" ? await loadSubs() : await loadUsers(); }
      catch (e) { $("list").replaceChildren(el("div", "msg err", "加载失败：" + (e.message || e))); }
    }

    async function nameMap() {
      const { data } = await db.from("profiles").select("id, username");
      const m = {}; (data || []).forEach(p => m[p.id] = p.username); return m;
    }

    async function loadSubs() {
      let q = db.from("submissions").select("*").order("created_at", { ascending: false });
      if (filter !== "all") q = q.eq("review_status", filter);
      const { data, error } = await q; if (error) throw error;
      const names = await nameMap();
      const box = $("list"); box.replaceChildren();
      if (!data.length) { box.append(el("div", "msg", "这里没有内容")); return; }
      data.forEach(s => {
        const c = el("div", "card");
        const h = el("h3", "", s.character_name || s.title);
        h.append(el("span", "tag " + s.review_status, LABEL[s.review_status] || s.review_status));
        c.append(h, el("div", "meta", "提交人：" + (names[s.user_id] || "未知") + " · " + fmt(s.created_at)));
        if (s.character_name && s.title) c.append(field("标题", s.title));
        if (s.content) c.append(field("介绍", s.content));
        if (s.abilities) c.append(field("能力", s.abilities));
        if (s.weaknesses) c.append(field("弱点", s.weaknesses));
        if (s.power_score != null) c.append(field("战力", s.power_score));
        if (s.review_note) c.append(field("审核备注", s.review_note));
        const acts = el("div", "acts");
        if (s.review_status !== "approved") acts.append(btn("通过", "ok", () => review(s.id, "approved")));
        if (s.review_status !== "rejected") acts.append(btn("驳回", "bad", () => review(s.id, "rejected")));
        acts.append(btn("删除", "bad", () => del(s.id)));
        c.append(acts); box.append(c);
      });
    }
    function field(k, v) { const d = el("div", "field"); d.append(el("b", "", k + "：")); d.append(document.createTextNode(String(v))); return d; }
    function btn(t, cls, fn) { const b = el("button", cls, t); b.type = "button"; b.onclick = async () => { b.disabled = true; await fn(); b.disabled = false; }; return b; }

    async function review(id, status) {
      let note = null;
      if (status === "rejected") { note = prompt("驳回原因（会保存为审核备注，可留空）："); if (note === null) return; }
      const { error } = await db.from("submissions").update({ review_status: status, review_note: note || null, reviewed_at: new Date().toISOString() }).eq("id", id);
      if (error) { toast("操作失败：" + error.message); return; }
      toast(status === "approved" ? "已通过" : "已驳回"); load();
    }
    async function del(id) {
      if (!confirm("确定删除这条提交吗？删除后无法恢复。")) return;
      const { error } = await db.from("submissions").delete().eq("id", id);
      if (error) { toast("删除失败：" + error.message); return; }
      toast("已删除"); load();
    }

    async function loadUsers() {
      const { data, error } = await db.from("profiles").select("*").order("created_at", { ascending: false });
      if (error) throw error;
      const box = $("list"); box.replaceChildren();
      if (!data.length) { box.append(el("div", "msg", "还没有用户")); return; }
      data.forEach(u => {
        const banned = u.status === "banned", self = u.id === me.id;
        const c = el("div", "card");
        const h = el("h3", "", u.username || "未命名");
        h.append(el("span", "tag " + u.role, LABEL[u.role] || u.role));
        h.append(el("span", "tag " + (banned ? "banned" : "active"), banned ? "已封禁" : "正常"));
        c.append(h, el("div", "meta", "注册时间：" + fmt(u.created_at) + (self ? " · 这是你自己" : "")));
        if (!self) {
          const acts = el("div", "acts");
          acts.append(banned
            ? btn("解封", "ok", () => setStatus(u.id, "active"))
            : btn("封禁", "bad", () => { if (confirm("确定封禁 " + (u.username || "该用户") + " 吗？封禁后无法再提交内容。")) return setStatus(u.id, "banned"); }));
          c.append(acts);
        }
        box.append(c);
      });
    }
    async function setStatus(id, status) {
      const { error } = await db.from("profiles").update({ status }).eq("id", id);
      if (error) { toast("操作失败：" + error.message); return; }
      toast(status === "banned" ? "已封禁" : "已解封"); load();
    }

    init();
  </script>
</body>
</html>
